<div class="page-shell">
  <a class="skip-link" href="#page-content">Skip to main content</a>

  <header class="topbar">
    <a class="brand-wrap" routerLink="/" aria-label="StyleHub home">
      <span class="brand-mark" aria-hidden="true">SH</span>
      <span class="brand-name">StyleHub</span>
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        class="nav-link"
        >Home</a
      >
      <a
        routerLink="/services"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        class="nav-link"
        >Services</a
      >
      @for (item of upcomingPages; track item) {
        <span class="upcoming-page" title="Coming soon">{{ item }}</span>
      }
    </nav>

    <button class="primary-button" type="button" (click)="bookNow()">Book now</button>
  </header>

  @if (bookingNotice()) {
    <p class="booking-notice" role="status">{{ bookingNotice() }}</p>
  }

  <main id="page-content" #pageContent tabindex="-1">
    <router-outlet (activate)="pageContent.focus()" />
  </main>

  <footer class="site-footer">
    <div>
      <p class="brand-name">StyleHub</p>
      <small>Upgrade your grooming experience.</small>
    </div>
    <a href="#">Contact support</a>
  </footer>
</div>
