<div class="page-shell">
  <a class="skip-link" href="#page-content" (click)="skipToContent($event, pageContent)">
    Skip to main content
  </a>

  <header class="topbar" (keydown.escape)="closeMobileMenu()">
    <a class="brand-wrap" routerLink="/" aria-label="StyleHub home" (click)="closeMobileMenu()">
      <span class="brand-mark" aria-hidden="true">SH</span>
      <span class="brand-name">StyleHub</span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-controls="main-navigation"
      [attr.aria-label]="mobileMenuOpen() ? 'Close navigation' : 'Open navigation'"
      (click)="toggleMobileMenu()"
    >
      <span class="menu-icon" [class.menu-icon-open]="mobileMenuOpen()" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>

    <nav
      id="main-navigation"
      class="main-nav"
      [class.mobile-menu-open]="mobileMenuOpen()"
      aria-label="Main navigation"
    >
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        class="nav-link"
        (click)="closeMobileMenu()"
        >Home</a
      >
      <a
        routerLink="/services"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        class="nav-link"
        (click)="closeMobileMenu()"
        >Services</a
      >
      <a
        routerLink="/shops"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        class="nav-link"
        (click)="closeMobileMenu()"
        >Shops</a
      >
      <a
        routerLink="/stylists"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        class="nav-link"
        (click)="closeMobileMenu()"
        >Stylists</a
      >
      <a
        routerLink="/marketplace"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        class="nav-link"
        (click)="closeMobileMenu()"
        >Marketplace</a
      >
      <a
        routerLink="/bookings"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        class="nav-link"
        (click)="closeMobileMenu()"
        >Bookings</a
      >
      <a
        routerLink="/login"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        class="nav-link"
        (click)="closeMobileMenu()"
        >Sign in</a
      >
      <button
        class="primary-button mobile-book-button"
        type="button"
        (click)="bookNow(); closeMobileMenu()"
      >
        Book now
      </button>
    </nav>

    <button class="primary-button desktop-book-button" type="button" (click)="bookNow()">
      Book now
    </button>
  </header>

  <main id="page-content" #pageContent tabindex="-1">
    <router-outlet (activate)="onRouteActivated(pageContent)" />
  </main>

  <footer class="site-footer">
    <div>
      <p class="brand-name">StyleHub</p>
      <small>Upgrade your grooming experience.</small>
    </div>
    <a href="#">Contact support</a>
  </footer>
</div>
